services:
  - type: web
    name: gikocam-relay
    runtime: node
    region: frankfurt
    plan: free
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: GIKO_BASE_URL
        value: https://gikopoipoi.net
      - key: ALLOWED_ORIGINS
        value: https://wiiiaboo.github.io,http://localhost:8123,http://127.0.0.1:8123
