# Runs behind the shared Caddy on the VPS (network docker-platform_default).
# No published ports: Caddy proxies cam.gikochan.net -> gikocam:8080.
services:
  gikocam:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: gikocam
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: https://cam.gikochan.net
      GIKO_BASE_URL: https://gikopoipoi.net
      ACCESS_TOKEN_FILE: /config/access-token
    volumes:
      # Lives outside ~/gikocam so deploys never touch it. Edit
      # ~/gikocam-config/access-token on the VPS to change the token.
      - ../../gikocam-config:/config:ro
    networks: [web]
networks:
  web:
    external: true
    name: docker-platform_default
